name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standalone
            ref: fedde931eda7f927b3ff34bd2318d7cc2c90a612
          - name: combined
            ref: 59b05cfa0b83f47da215004d0127c044c1e21d2d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Full check
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm check 2>&1 | tee check.log
      - name: Native test setup
        shell: bash
        env:
          HARNESS: a04860153ec1760796be48c5d5fbd7e496ff22ef
        run: |
          git fetch origin "$HARNESS"
          git show "$HARNESS:.github/geo-native.mjs" > "$RUNNER_TEMP/geo-native.mjs"
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
          npm install --prefix "$RUNNER_TEMP/native-deps" --no-save playwright@1.56.1
          mkdir -p "$RUNNER_TEMP/obsidian-desktop"
          curl -fL --retry 3 https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/obsidian-1.15.1.tar.gz -o "$RUNNER_TEMP/obsidian.tar.gz"
          tar -xzf "$RUNNER_TEMP/obsidian.tar.gz" -C "$RUNNER_TEMP/obsidian-desktop"
      - name: Native geo navigation
        env:
          NATIVE_DEPS: ${{ runner.temp }}/native-deps
          OBSIDIAN_BIN: ${{ runner.temp }}/obsidian-desktop/obsidian-1.15.1/obsidian
          UI_OUTPUT: native-geo
        run: node "$RUNNER_TEMP/geo-native.mjs" "$GITHUB_WORKSPACE" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wayfarer-geo-${{ matrix.name }}-2026-11-28
          path: |
            native-geo/
            check.log
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
